<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Документы{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
        header { background: #2c3e50; color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 20px; }
        header a { color: #fff; text-decoration: none; font-size: 15px; }
        header a:hover { text-decoration: underline; }
        header .logo { font-weight: bold; font-size: 17px; margin-right: 10px; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 13px; font-weight: bold; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }
        main { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6e8; vertical-align: top; }
        th { background: #f0f2f4; }
        tr:hover td { background: #f8f9fa; }
        h1 { font-size: 22px; margin: 0 0 15px; }
        h2 { font-size: 16px; margin: 20px 0 10px; color: #2c3e50; border-bottom: 1px solid #e3e6e8; padding-bottom: 5px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 3px; }
        input[type=text], input[type=date], input[type=number], textarea, select {
            width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; font-family: inherit;
        }
        textarea { min-height: 60px; resize: vertical; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .grid .full { grid-column: 1 / -1; }
        .btn { display: inline-block; padding: 8px 18px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; text-decoration: none; }
        .btn-primary { background: #337ab7; color: #fff; }
        .btn-danger { background: #d9534f; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn:hover { opacity: .88; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .stats { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat { background: #fff; border-radius: 8px; padding: 15px 22px; box-shadow: 0 1px 3px rgba(0,0,0,.1); text-align: center; }
        .stat .num { font-size: 28px; font-weight: bold; }
        .stat .lbl { font-size: 13px; color: #666; }
        .muted { color: #888; font-size: 13px; }
        pre.raw { background: #f0f2f4; padding: 12px; border-radius: 5px; font-size: 12px; overflow-x: auto; max-height: 300px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; }
        .checkbox-row input { width: auto; }
        details summary { cursor: pointer; color: #337ab7; font-size: 14px; }
        #toast-container { position: fixed; top: 60px; right: 15px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #2c3e50; color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,.3); font-size: 14px; max-width: 320px; animation: slideIn .3s ease; cursor: pointer; }
        .toast a { color: #5dade2; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
<header>
    <span class="logo">📄 Проверка документов</span>
    <a href="/">Главная</a>
    <a href="/raw?status=pending">Проверка <span class="badge badge-pending" id="pending-badge" style="margin-left:4px">{{ pending_count|default('', true) }}</span></a>
    <a href="/documents">Документы</a>
    <a href="/counterparties">Контрагенты</a>
</header>
<main>
{% block content %}{% endblock %}
</main>

<div id="toast-container"></div>

<script>
(function() {
    var pendingCount = {{ pending_count|default(0, true) }};

    function updateBadge() {
        var badge = document.getElementById('pending-badge');
        if (badge) badge.textContent = pendingCount;
    }

    function refreshPendingCount() {
        fetch('/api/pending-count')
            .then(function(r) { return r.json(); })
            .then(function(d) { pendingCount = d.count; updateBadge(); })
            .catch(function() {});
    }

    var es = new EventSource('/events');
    es.addEventListener('new_raw_document', function(e) {
        var data = JSON.parse(e.data);
        pendingCount++;
        updateBadge();

        var labels = {upd:'УПД', invoice:'Счёт-фактура', payment_order:'Счёт на оплату',
                      contract:'Договор', act:'Акт', letter:'Письмо', personal:'Личный документ', unknown:'Документ'};
        var label = labels[data.doc_type] || data.doc_type;
        var div = document.createElement('div');
        div.className = 'toast';
        div.innerHTML = '📄 Новый документ: <b>' + data.file_name + '</b> (' + label + ') — <a href="/raw/' + data.id + '">проверить</a>';
        div.onclick = function() { div.remove(); };
        document.getElementById('toast-container').appendChild(div);
        setTimeout(function() { div.remove(); }, 15000);

        // Пересинхронизировать точный счётчик с бэкенда
        refreshPendingCount();
    });
    es.onerror = function() { /* EventSource переподключается автоматически */ };
})();
</script>
</body>
</html>
